<div
  class="fixed left-0 top-0 h-full w-64 bg-gray-800 text-white p-4 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out z-50"
  id="sidebar"
>
  <div class="flex items-center justify-between mb-6">
    <h3 class="text-xl font-bold">GifsApp</h3>
  </div>
  <hr class="border-gray-600 mb-4" />
  <div *ngFor="let item of tags" class="space-y-2">
    <li
      (click)="gifsService.searchTag(item)"
      class="w-full text-left px-4 py-2 rounded hover:bg-gray-700 transition-colors duration-200"
    >
      {{ item | titlecase }}
    </li>
  </div>
</div>
